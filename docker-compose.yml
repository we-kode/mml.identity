services:
  wekode.mml.identity:
    image: ${IMAGE}
    build:
      context: .
      dockerfile: Identity.API/Dockerfile
      args:
        - UID=${UID}
        - GID=${GID}
        - DOT_NET_BUILD_CONFIG=${DOT_NET_BUILD_CONFIG}
    container_name: wekode.mml.identity
    restart: always
    user: ${UID}:${GID}
    environment:
      INSTANCE: ${INSTANCE}
      ENCRYPT_SECRET: ${ENCRYPT_SECRET:-}
      SIGN_SECRET: ${SIGN_SECRET:-}
      ENCRYPT_SECRET_FILE: /run/secrets/encrypt_secret
      SIGN_SECRET_FILE: /run/secrets/sign_secret
    volumes:
      - ${VOL_CERTS}:/etc/ssl/certs:ro,z
      - ${APPSETTINGS}:/configs/appsettings.json:ro,Z
      - ${IDENTITY_SECRETS_PATH}:/secrets
      # optional secret files, /dev/null if not configured
      - ${ENCRYPT_SECRET_FILE:-/dev/null}:/run/secrets/encrypt_secret:ro
      - ${SIGN_SECRET_FILE:-/dev/null}:/run/secrets/sign_secret:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - wekode.mml
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"

networks:
  wekode.mml:
    external: true
